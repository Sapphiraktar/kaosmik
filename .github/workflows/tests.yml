name: Tests KaosmiK

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kaosmik_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, mbstring, mysqli
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Composer audit
        run: composer audit

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --no-coverage --colors=always

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-logs-php${{ matrix.php-version }}
          path: build/logs/
          if-no-files-found: ignore

      - name: Check migrations
        env:
          CI_ENVIRONMENT: development
          database.default.hostname: 127.0.0.1
          database.default.database: kaosmik_tests
          database.default.username: root
          database.default.password: root
          database.default.DBDriver: MySQLi
          database.default.port: 3306
        run: php spark migrate --all